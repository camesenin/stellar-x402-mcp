name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-rust-contracts:
    name: Soroban Smart Contracts Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32v1-none

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts

      - name: Run Soroban Tests
        working-directory: packages/contracts
        run: cargo test --locked

      - name: Compile Soroban Wasm Target
        working-directory: packages/contracts
        run: cargo build --target wasm32v1-none --release --locked

  test-typescript:
    name: TypeScript Monorepo Build & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stellar_x402_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm approve-builds --all
          pnpm install

      - name: Build TypeScript Packages
        run: pnpm build

      - name: Verify PostgreSQL 16 Schema Migration
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/stellar_x402_test
        run: |
          psql  -f packages/gateway/migrations/001_initial.sql
          # Second execution to verify strict idempotency
          psql  -f packages/gateway/migrations/001_initial.sql

      - name: Run Vitest Unit Tests
        run: pnpm test
