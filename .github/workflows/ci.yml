name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-rust-contracts:
    name: Soroban Smart Contracts Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32v1-none

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts

      - name: Run Soroban Tests
        working-directory: packages/contracts
        run: cargo test --locked

      - name: Compile Soroban Wasm Target
        working-directory: packages/contracts
        run: cargo build --target wasm32v1-none --release --locked

  test-typescript:
    name: TypeScript Monorepo Build & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stellar_x402_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm approve-builds --all
          pnpm install

      - name: Build TypeScript Packages
        run: pnpm build

      - name: Verify PostgreSQL 16 Schema Migration & Idempotency
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: stellar_x402_test
          PGUSER: testuser
          PGPASSWORD: testpassword
        run: |
          # 1. Clean Database Migration Test (Brand new deployment)
          psql -X -v ON_ERROR_STOP=1 -f packages/gateway/migrations/001_initial.sql
          # Clean up tables to prepare realistic legacy migration suite
          psql -X -v ON_ERROR_STOP=1 -c "DROP TABLE IF EXISTS redeemed_transactions CASCADE; DROP TABLE IF EXISTS challenges CASCADE;"

          # 2. Setup realistic legacy test fixtures with real multi-row data across all edge cases:
          # - Legacy column 'challenge_id' (before rename to id)
          # - Legacy composite CHECK constraint covering status AND amount
          # - Legacy table with amount_stroops NOT NULL
          # - Missing 'resource' column
          # - Row 1: Valid legacy challenge with text amount '0.05' and distinct bound_tx_hash
          # - Row 2: Incomplete redeemed challenge (is_redeemed=1, missing txHash) -> must isolate into RECONCILIATION_REQUIRED
          # - Row 3: Challenge previously marked status='REDEEMED' with missing evidence -> must isolate into RECONCILIATION_REQUIRED
          # - Row 4: Unmetered/unknown amount (amount IS NULL) -> must isolate into INCONCLUSIVE_MANUAL_REVIEW with amount_stroops NULL
          # - Row 5: Challenge already in PERMANENT_QUARANTINE with NULL amount_stroops -> must PRESERVE status and NULL
          # - Unique index/constraint test on challenges (canonical standard uniqueness allowing multiple nulls):
          #   Row 2, 3 and 5 all have bound_tx_hash IS NULL, perfectly valid under standard unique constraint.
          # - Protected specialized indexes: partial, text_pattern_ops, duplicate to purge.
          psql -X -v ON_ERROR_STOP=1 << 'EOF'
            CREATE TABLE challenges (
              challenge_id TEXT PRIMARY KEY,
              destination TEXT NOT NULL,
              amount TEXT,
              amount_stroops NUMERIC(40, 0) NOT NULL,
              asset TEXT NOT NULL,
              memo TEXT NOT NULL,
              network TEXT NOT NULL,
              status TEXT NOT NULL DEFAULT 'PENDING',
              expires_at BIGINT NOT NULL,
              created_at BIGINT NOT NULL,
              bound_tx_hash TEXT,
              is_redeemed INTEGER NOT NULL DEFAULT 0,
              CONSTRAINT chk_legacy_composite CHECK (status IN ('PENDING', 'REDEEMED', 'PERMANENT_QUARANTINE') AND amount_stroops >= 0)
            );

            -- Row 1: Valid legacy challenge
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, is_redeemed
            ) VALUES (
              'ch_legacy_seed_1',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              '0.05',
              500000,
              'XLM',
              'memo_seed_1',
              'testnet',
              'PENDING',
              1793815821820,
              1793815521820,
              'tx_seed_hash_abc123',
              0
            );

            -- Row 2: Incomplete is_redeemed=1 without hash -> must transition safely to RECONCILIATION_REQUIRED
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, is_redeemed
            ) VALUES (
              'ch_legacy_seed_2',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              '0.10',
              1000000,
              'XLM',
              'memo_seed_2',
              'testnet',
              'PENDING',
              1793815821820,
              1793815521820,
              NULL,
              1
            );

            -- Row 3: Previously marked status='REDEEMED' but lacking hash/proof -> must transition to RECONCILIATION_REQUIRED
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, is_redeemed
            ) VALUES (
              'ch_legacy_seed_3',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              '0.20',
              2000000,
              'XLM',
              'memo_seed_3',
              'testnet',
              'REDEEMED',
              1793815821820,
              1793815521820,
              NULL,
              1
            );

            -- Row 4: Unmetered amount (amount IS NULL) -> must isolate to INCONCLUSIVE_MANUAL_REVIEW
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, is_redeemed
            ) VALUES (
              'ch_legacy_seed_4',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              NULL,
              0,
              'XLM',
              'memo_seed_4',
              'testnet',
              'PENDING',
              1793815821820,
              1793815521820,
              'tx_unmetered_hash_distinct',
              0
            );

            -- Row 5: Challenge already in PERMANENT_QUARANTINE with NULL hash -> status must be PRESERVED
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, is_redeemed
            ) VALUES (
              'ch_legacy_seed_5',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              NULL,
              0,
              'XLM',
              'memo_seed_5',
              'testnet',
              'PERMANENT_QUARANTINE',
              1793815821820,
              1793815521820,
              NULL,
              0
            );

            -- 1. Index to be purged by Case D (standard duplicate btree text_ops on bound_tx_hash)
            CREATE INDEX idx_legacy_duplicate_bound ON challenges USING btree (bound_tx_hash);

            -- 2. Protected partial index (MUST be preserved)
            CREATE INDEX idx_legacy_partial_bound ON challenges USING btree (bound_tx_hash) WHERE status = 'PENDING';

            -- 3. Protected specialized opclass index (MUST be preserved)
            CREATE INDEX idx_legacy_pattern_bound ON challenges USING btree (bound_tx_hash text_pattern_ops);
          EOF

          # 3. First evolutionary migration run
          psql -X -v ON_ERROR_STOP=1 -f packages/gateway/migrations/001_initial.sql

          # 4. Shared Invariant Verification Function (Asserts schema, data preservation, quarantine and indexes)
          psql -X -v ON_ERROR_STOP=1 << 'EOF'
            CREATE OR REPLACE FUNCTION verify_migration_invariants(step_name TEXT) RETURNS VOID AS $$
            DECLARE
              rec1 RECORD;
              rec2 RECORD;
              rec3 RECORD;
              rec4 RECORD;
              rec5 RECORD;
              is_nullable TEXT;
            BEGIN
              -- A. Column evolution and rename checks
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns 
                WHERE table_schema = current_schema() AND table_name = 'challenges' AND column_name = 'id'
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: challenge_id was not migrated to id', step_name;
              END IF;

              IF EXISTS (
                SELECT 1 FROM information_schema.columns 
                WHERE table_schema = current_schema() AND table_name = 'challenges' AND column_name = 'challenge_id'
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: legacy challenge_id column still exists', step_name;
              END IF;

              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns 
                WHERE table_schema = current_schema() AND table_name = 'challenges' AND column_name = 'resource'
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: resource column missing', step_name;
              END IF;

              -- B. amount_stroops column must be nullable to support unmetered quarantined rows
              SELECT is_nullable INTO is_nullable FROM information_schema.columns 
              WHERE table_schema = current_schema() AND table_name = 'challenges' AND column_name = 'amount_stroops';
              IF is_nullable IS DISTINCT FROM 'YES' THEN
                RAISE EXCEPTION '[%] Assertion failed: amount_stroops is not nullable (got %)', step_name, is_nullable;
              END IF;

              -- C. Data preservation and conversion checks
              SELECT * INTO rec1 FROM challenges WHERE id = 'ch_legacy_seed_1';
              IF rec1.id IS NULL THEN
                RAISE EXCEPTION '[%] Assertion failed: legacy seed data was lost', step_name;
              END IF;
              IF rec1.amount_stroops IS DISTINCT FROM 500000 THEN
                RAISE EXCEPTION '[%] Assertion failed: amount 0.05 XLM not converted to 500,000 stroops (got %)', step_name, rec1.amount_stroops;
              END IF;
              IF rec1.resource IS NULL OR rec1.created_at IS NULL OR rec1.expires_at IS NULL THEN
                RAISE EXCEPTION '[%] Assertion failed: timestamps or resource not populated', step_name;
              END IF;

              -- D. Safe isolation check for incomplete redeemed challenges
              SELECT * INTO rec2 FROM challenges WHERE id = 'ch_legacy_seed_2';
              IF rec2.status IS DISTINCT FROM 'RECONCILIATION_REQUIRED' THEN
                RAISE EXCEPTION '[%] Assertion failed: incomplete is_redeemed row not safely isolated into RECONCILIATION_REQUIRED (got %)', step_name, rec2.status;
              END IF;

              SELECT * INTO rec3 FROM challenges WHERE id = 'ch_legacy_seed_3';
              IF rec3.status IS DISTINCT FROM 'RECONCILIATION_REQUIRED' THEN
                RAISE EXCEPTION '[%] Assertion failed: unproven REDEEMED row not safely isolated into RECONCILIATION_REQUIRED (got %)', step_name, rec3.status;
              END IF;

              -- E. Safe isolation of unmetered challenge
              SELECT * INTO rec4 FROM challenges WHERE id = 'ch_legacy_seed_4';
              IF rec4.status IS DISTINCT FROM 'INCONCLUSIVE_MANUAL_REVIEW' THEN
                RAISE EXCEPTION '[%] Assertion failed: unmetered row not isolated into INCONCLUSIVE_MANUAL_REVIEW (got %)', step_name, rec4.status;
              END IF;

              -- F. Preservation of PERMANENT_QUARANTINE
              SELECT * INTO rec5 FROM challenges WHERE id = 'ch_legacy_seed_5';
              IF rec5.status IS DISTINCT FROM 'PERMANENT_QUARANTINE' THEN
                RAISE EXCEPTION '[%] Assertion failed: PERMANENT_QUARANTINE degraded to %', step_name, rec5.status;
              END IF;

              -- G. Purge & Preservation Assertions
              -- 1. idx_legacy_duplicate_bound MUST be purged
              IF EXISTS (
                SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE c.relname = 'idx_legacy_duplicate_bound' AND n.nspname = current_schema()
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: idx_legacy_duplicate_bound was not purged by Case D', step_name;
              END IF;

              -- 2. idx_legacy_partial_bound MUST be preserved
              IF NOT EXISTS (
                SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE c.relname = 'idx_legacy_partial_bound' AND n.nspname = current_schema()
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: idx_legacy_partial_bound was unexpectedly dropped', step_name;
              END IF;

              -- 3. idx_legacy_pattern_bound MUST be preserved
              IF NOT EXISTS (
                SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE c.relname = 'idx_legacy_pattern_bound' AND n.nspname = current_schema()
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: idx_legacy_pattern_bound was unexpectedly dropped', step_name;
              END IF;

              -- 4. Canonical constraint uq_challenges_bound_tx_hash MUST exist and be validated
              IF NOT EXISTS (
                SELECT 1 FROM pg_constraint con JOIN pg_class c ON c.oid = con.conrelid
                WHERE con.conname = 'uq_challenges_bound_tx_hash' AND c.relname = 'challenges' AND con.convalidated = true
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: canonical uq_challenges_bound_tx_hash constraint missing or unvalidated', step_name;
              END IF;
            END;
            $$ LANGUAGE plpgsql;
          EOF

          # Run assertions after Run 1
          psql -X -v ON_ERROR_STOP=1 -c "SELECT verify_migration_invariants('Run 1');"

          # 5. Second migration run (Strict Idempotency Verification)
          psql -X -v ON_ERROR_STOP=1 -f packages/gateway/migrations/001_initial.sql

          # 6. Repeat identical assertions after Run 2
          psql -X -v ON_ERROR_STOP=1 -c "SELECT verify_migration_invariants('Run 2 (Idempotency)');"

          # 7. Operational Test: insert multiple pending challenges with bound_tx_hash IS NULL
          psql -X -v ON_ERROR_STOP=1 << 'EOF'
            INSERT INTO challenges (
              id, destination, amount_stroops, asset, resource, memo, network, status, created_at, expires_at, bound_tx_hash
            ) VALUES (
              'ch_op_pending_1',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              100000,
              'XLM',
              'mcp://tools/test',
              'memo_op_1',
              'testnet',
              'PENDING',
              clock_timestamp(),
              clock_timestamp() + interval '5 minutes',
              NULL
            ), (
              'ch_op_pending_2',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              200000,
              'XLM',
              'mcp://tools/test',
              'memo_op_2',
              'testnet',
              'PENDING',
              clock_timestamp(),
              clock_timestamp() + interval '5 minutes',
              NULL
            );
          EOF

      - name: Run Vitest Unit Tests
        run: pnpm test
