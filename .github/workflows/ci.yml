name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-rust-contracts:
    name: Soroban Smart Contracts Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32v1-none

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts

      - name: Run Soroban Tests
        working-directory: packages/contracts
        run: cargo test --locked

      - name: Compile Soroban Wasm Target
        working-directory: packages/contracts
        run: cargo build --target wasm32v1-none --release --locked

  test-typescript:
    name: TypeScript Monorepo Build & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stellar_x402_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm approve-builds --all
          pnpm install

      - name: Build TypeScript Packages
        run: pnpm build

      - name: Verify PostgreSQL 16 Schema Migration & Idempotency
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: stellar_x402_test
          PGUSER: testuser
          PGPASSWORD: testpassword
        run: |
          # 1. Clean Database Migration Test (Brand new deployment)
          psql -X -v ON_ERROR_STOP=1 -f packages/gateway/migrations/001_initial.sql
          # Clean up tables to prepare realistic legacy migration suite
          psql -X -v ON_ERROR_STOP=1 -c "DROP TABLE IF EXISTS redeemed_transactions CASCADE; DROP TABLE IF EXISTS challenges CASCADE;"

          # 2. Setup realistic legacy test fixtures with real multi-row data across all edge cases:
          # - Legacy column 'challenge_id' (before rename to id)
          # - Legacy composite CHECK constraint covering status AND amount_stroops
          # - Legacy table with amount_stroops NOT NULL
          # - Missing 'resource' column
          # - Row 1: Valid legacy challenge with text amount '0.05' and unpopulated amount_stroops=0 -> converts to 500,000 stroops
          # - Row 2: Incomplete redeemed challenge (is_redeemed=1, bound_tx_hash=NULL) -> converges into RECONCILIATION_REQUIRED
          # - Row 3: Challenge previously marked status='REDEEMED' (bound_tx_hash=NULL) -> converges into RECONCILIATION_REQUIRED (tests multiple NULL hashes converging to same status under incompatible index!)
          # - Row 4: Unmetered/unknown amount (amount IS NULL) with amount_stroops=0 -> normalizes to amount_stroops=NULL and isolates into INCONCLUSIVE_MANUAL_REVIEW
          # - Row 5: Challenge already in PERMANENT_QUARANTINE with amount_stroops=0 -> normalizes to amount_stroops=NULL and strictly PRESERVES PERMANENT_QUARANTINE
          # - Row 6: Challenge already in INCONCLUSIVE_MANUAL_REVIEW with amount_stroops='NaN' -> normalizes to amount_stroops=NULL and strictly PRESERVES INCONCLUSIVE_MANUAL_REVIEW
          # - Row 7: Legacy challenge with corrupt non-numeric amount text 'malformed_500' -> safe short-circuit isolates to INCONCLUSIVE_MANUAL_REVIEW without aborting
          # - Row 8: Legacy challenge with 34-digit integer overflow text -> safe short-circuit isolates to INCONCLUSIVE_MANUAL_REVIEW without aborting
          # - Row 9: CAUSAL ISOLATION TEST: Complete redeemed challenge with valid hash, valid redeemed_at, valid amount, but paid_amount_stroops = 'NaN' -> MUST isolate to RECONCILIATION_REQUIRED solely due to NaN payment!
          # - Legacy constraint with NULLS NOT DISTINCT (uq_challenges_bound_tx_hash) -> exercises Case C transition to standard unique!
          # - Duplicate btree index on bound_tx_hash to be purged
          # - Incompatible composite unique index (status, bound_tx_hash) with NULLS NOT DISTINCT -> must be purged by Case D!
          # - Incompatible composite unique constraint with NULLS NOT DISTINCT (uq_legacy_incompatible_composite) -> must be purged early!
          # - Incompatible partial unique index with OR disjunction '(bound_tx_hash IS NOT NULL OR status = 'PENDING') NULLS NOT DISTINCT' -> must be purged by Case D!
          # - Protected partial index (WHERE (status = 'PENDING'))
          # - Protected partial unique index (WHERE (bound_tx_hash IS NOT NULL))
          # - Protected specialized text_pattern_ops index
          psql -X -v ON_ERROR_STOP=1 << 'EOF'
            CREATE TABLE challenges (
              challenge_id TEXT PRIMARY KEY,
              destination TEXT NOT NULL,
              amount TEXT,
              amount_stroops NUMERIC(40, 0) NOT NULL,
              asset TEXT NOT NULL,
              memo TEXT NOT NULL,
              network TEXT NOT NULL,
              status TEXT NOT NULL DEFAULT 'PENDING',
              expires_at BIGINT NOT NULL,
              created_at BIGINT NOT NULL,
              bound_tx_hash TEXT,
              paid_amount_stroops NUMERIC(40, 0),
              redeemed_at BIGINT,
              is_redeemed INTEGER NOT NULL DEFAULT 0,
              CONSTRAINT chk_legacy_composite CHECK (status IN ('PENDING', 'REDEEMED', 'INCONCLUSIVE_MANUAL_REVIEW', 'PERMANENT_QUARANTINE')),
              -- Incompatible composite UNIQUE constraint with NULLS NOT DISTINCT on (status, bound_tx_hash):
              -- Validly admits (PENDING, NULL) and (REDEEMED, NULL) during initial population!
              -- Tests that EARLY_STRUCTURAL_PURGE drops this incompatible constraint BEFORE EVOLVE_DATA,
              -- allowing both rows to converge to status = 'RECONCILIATION_REQUIRED' without uniqueness conflict!
              CONSTRAINT uq_legacy_incompatible_composite UNIQUE NULLS NOT DISTINCT (status, bound_tx_hash)
            );

            -- Row 1: Valid legacy challenge starting with amount_stroops=0 to test REAL conversion from '0.05'
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, is_redeemed
            ) VALUES (
              'ch_legacy_seed_1',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              '0.05',
              0,
              'XLM',
              'memo_seed_1',
              'testnet',
              'PENDING',
              1793815821820,
              1793815521820,
              'tx_seed_hash_abc123',
              0
            );

            -- Row 2: Incomplete is_redeemed=1 with bound_tx_hash IS NULL (starts PENDING)
            -- Both Row 2 and Row 3 converge to status = 'RECONCILIATION_REQUIRED' while bound_tx_hash IS NULL.
            -- Under an incompatible composite unique index (status, bound_tx_hash) NULLS NOT DISTINCT,
            -- this would fail if EVOLVE_DATA ran before Case D. With early structural purge, this transitions safely!
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, is_redeemed
            ) VALUES (
              'ch_legacy_seed_2',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              '0.10',
              1000000,
              'XLM',
              'memo_seed_2',
              'testnet',
              'PENDING',
              1793815821820,
              1793815521820,
              NULL,
              1
            );

            -- Row 3: Previously marked status='REDEEMED' with bound_tx_hash IS NULL
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, is_redeemed
            ) VALUES (
              'ch_legacy_seed_3',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              '0.20',
              2000000,
              'XLM',
              'memo_seed_3',
              'testnet',
              'REDEEMED',
              1793815821820,
              1793815521820,
              NULL,
              1
            );

            -- Row 4: Unmetered amount (amount IS NULL, legacy amount_stroops=0) -> must isolate to INCONCLUSIVE_MANUAL_REVIEW with amount_stroops=NULL
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, is_redeemed
            ) VALUES (
              'ch_legacy_seed_4',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              NULL,
              0,
              'XLM',
              'memo_seed_4',
              'testnet',
              'PENDING',
              1793815821820,
              1793815521820,
              'tx_unmetered_hash_distinct',
              0
            );

            -- Row 5: Challenge already in PERMANENT_QUARANTINE with amount_stroops=0 -> status must be PRESERVED and amount_stroops normalized to NULL
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, is_redeemed
            ) VALUES (
              'ch_legacy_seed_5',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              NULL,
              0,
              'XLM',
              'memo_seed_5',
              'testnet',
              'PERMANENT_QUARANTINE',
              1793815821820,
              1793815521820,
              'tx_quarantined_hash_5',
              0
            );

            -- Row 6: Challenge already in INCONCLUSIVE_MANUAL_REVIEW with amount_stroops='NaN' -> status must be PRESERVED and amount_stroops normalized to NULL
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, is_redeemed
            ) VALUES (
              'ch_legacy_seed_6',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              NULL,
              'NaN'::numeric,
              'XLM',
              'memo_seed_6',
              'testnet',
              'INCONCLUSIVE_MANUAL_REVIEW',
              1793815821820,
              1793815521820,
              'tx_quarantined_hash_6',
              0
            );

            -- Row 7: Corrupt textual amount -> tests short-circuit protection against cast errors
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, is_redeemed
            ) VALUES (
              'ch_legacy_seed_7',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              'malformed_amount_string_500',
              0,
              'XLM',
              'memo_seed_7',
              'testnet',
              'PENDING',
              1793815821820,
              1793815521820,
              'tx_quarantined_hash_7',
              0
            );

            -- Row 8: 34-digit integer overflow textual amount -> tests short-circuit protection against overflow
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, is_redeemed
            ) VALUES (
              'ch_legacy_seed_8',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              '9999999999999999999999999999999999',
              0,
              'XLM',
              'memo_seed_8',
              'testnet',
              'PENDING',
              1793815821820,
              1793815521820,
              'tx_quarantined_hash_8',
              0
            );

            -- Row 9: CAUSAL ISOLATION TEST: All redemption proofs are valid (txHash, valid redeemed_at timestamp, valid amount_stroops),
            -- BUT paid_amount_stroops = 'NaN' -> MUST isolate to RECONCILIATION_REQUIRED solely due to NaN payment!
            INSERT INTO challenges (
              challenge_id, destination, amount, amount_stroops, asset, memo, network, status, expires_at, created_at, bound_tx_hash, paid_amount_stroops, redeemed_at, is_redeemed
            ) VALUES (
              'ch_legacy_seed_9',
              'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
              '0.30',
              3000000,
              'XLM',
              'memo_seed_9',
              'testnet',
              'REDEEMED',
              1793815821820,
              1793815521820,
              'tx_valid_proof_hash_9',
              'NaN'::numeric,
              1793815621820,
              1
            );

            -- 1. Duplicate btree index on bound_tx_hash to be purged
            CREATE INDEX idx_legacy_duplicate_bound ON challenges USING btree (bound_tx_hash);

            -- 2. Incompatible composite unique index (status, bound_tx_hash) with NULLS NOT DISTINCT -> must be purged!
            CREATE UNIQUE INDEX idx_legacy_incompatible_composite_status_hash ON challenges (status, bound_tx_hash) NULLS NOT DISTINCT;

            -- 3. Incompatible partial unique index with OR disjunction that admits NULLs in pending rows -> must be purged!
            CREATE UNIQUE INDEX idx_legacy_incompatible_partial_or_nulls ON challenges (status, bound_tx_hash) NULLS NOT DISTINCT WHERE (bound_tx_hash IS NOT NULL OR status = 'PENDING');

            -- 3b. Adversarial regression: boolean wrapper IS NOT TRUE admitting null hashes -> must be purged by Case D!
            CREATE UNIQUE INDEX idx_legacy_adversarial_is_not_true ON challenges (status, bound_tx_hash) NULLS NOT DISTINCT WHERE (((bound_tx_hash IS NOT NULL) IS NOT TRUE));

            -- 4. Protected partial index (MUST be preserved)
            CREATE INDEX idx_legacy_partial_bound ON challenges USING btree (bound_tx_hash) WHERE (status = 'PENDING');

            -- 5. Protected partial unique index strictly on NOT NULL (MUST be preserved)
            CREATE UNIQUE INDEX idx_legacy_protected_partial_not_null ON challenges (bound_tx_hash) WHERE (bound_tx_hash IS NOT NULL);

            -- 6. Protected UNIQUE NULLS NOT DISTINCT partial index with legitimate conjunction (bound_tx_hash IS NOT NULL AND status != 'CANCELLED')
            -- Strictly guarantees bound_tx_hash IS NOT NULL on all indexed entries -> MUST be preserved!
            CREATE UNIQUE INDEX idx_legacy_protected_partial_conjunctive ON challenges (bound_tx_hash) NULLS NOT DISTINCT WHERE (bound_tx_hash IS NOT NULL AND status != 'CANCELLED');

            -- 7. Protected specialized opclass index (MUST be preserved)
            CREATE INDEX idx_legacy_pattern_bound ON challenges USING btree (bound_tx_hash text_pattern_ops);
          EOF

          # 3. First evolutionary migration run
          psql -X -v ON_ERROR_STOP=1 -f packages/gateway/migrations/001_initial.sql

          # 4. Shared Invariant Verification Function (Asserts schema, data preservation, quarantine, indexes, multiple null inserts, and duplicate rejection)
          psql -X -v ON_ERROR_STOP=1 << 'EOF'
            CREATE OR REPLACE FUNCTION verify_migration_invariants(step_name TEXT) RETURNS VOID AS $$
            DECLARE
              rec1 RECORD;
              rec2 RECORD;
              rec3 RECORD;
              rec4 RECORD;
              rec5 RECORD;
              rec6 RECORD;
              rec7 RECORD;
              rec8 RECORD;
              rec9 RECORD;
              v_is_nullable TEXT;
              v_indnullsnotdistinct BOOLEAN;
              v_pred TEXT;
              v_opcname TEXT;
              v_diag_constraint TEXT;
              v_indisunique BOOLEAN;
              v_indnullsnotdistinct_p BOOLEAN;
              v_indisvalid BOOLEAN;
              v_indkey TEXT;
            BEGIN
              -- A. Column evolution and rename checks
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns 
                WHERE table_schema = current_schema() AND table_name = 'challenges' AND column_name = 'id'
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: challenge_id was not migrated to id', step_name;
              END IF;

              IF EXISTS (
                SELECT 1 FROM information_schema.columns 
                WHERE table_schema = current_schema() AND table_name = 'challenges' AND column_name = 'challenge_id'
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: legacy challenge_id column still exists', step_name;
              END IF;

              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns 
                WHERE table_schema = current_schema() AND table_name = 'challenges' AND column_name = 'resource'
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: resource column missing', step_name;
              END IF;

              -- B. amount_stroops column must be nullable (disables legacy NOT NULL)
              SELECT cols.is_nullable INTO v_is_nullable FROM information_schema.columns cols
              WHERE cols.table_schema = current_schema() AND cols.table_name = 'challenges' AND cols.column_name = 'amount_stroops';
              IF v_is_nullable IS DISTINCT FROM 'YES' THEN
                RAISE EXCEPTION '[%] Assertion failed: amount_stroops is not nullable (got %)', step_name, v_is_nullable;
              END IF;

              -- C. Data preservation and conversion checks:
              -- Validates that '0.05' was REAL converted to 500,000 stroops (started at 0 in fixture)
              SELECT * INTO rec1 FROM challenges WHERE id = 'ch_legacy_seed_1';
              IF rec1.id IS NULL THEN
                RAISE EXCEPTION '[%] Assertion failed: legacy seed data was lost', step_name;
              END IF;
              IF rec1.amount_stroops IS DISTINCT FROM 500000 THEN
                RAISE EXCEPTION '[%] Assertion failed: amount 0.05 XLM not converted to 500,000 stroops (got %)', step_name, rec1.amount_stroops;
              END IF;
              -- Verify exact converted timestamp (1793815521820 ms = 2026-11-04 18:05:21.82 UTC)
              IF rec1.created_at IS DISTINCT FROM to_timestamp(1793815521820::double precision / 1000.0) THEN
                RAISE EXCEPTION '[%] Assertion failed: created_at timestamp mismatch (got %)', step_name, rec1.created_at;
              END IF;

              -- D. Safe convergence check for multiple incomplete challenges with bound_tx_hash IS NULL
              SELECT * INTO rec2 FROM challenges WHERE id = 'ch_legacy_seed_2';
              IF rec2.status IS DISTINCT FROM 'RECONCILIATION_REQUIRED' OR rec2.bound_tx_hash IS NOT NULL THEN
                RAISE EXCEPTION '[%] Assertion failed: rec2 not converged to RECONCILIATION_REQUIRED with NULL hash (status %, hash %)', step_name, rec2.status, rec2.bound_tx_hash;
              END IF;

              SELECT * INTO rec3 FROM challenges WHERE id = 'ch_legacy_seed_3';
              IF rec3.status IS DISTINCT FROM 'RECONCILIATION_REQUIRED' OR rec3.bound_tx_hash IS NOT NULL THEN
                RAISE EXCEPTION '[%] Assertion failed: rec3 not converged to RECONCILIATION_REQUIRED with NULL hash (status %, hash %)', step_name, rec3.status, rec3.bound_tx_hash;
              END IF;

              -- E. Safe isolation of unmetered challenge
              SELECT * INTO rec4 FROM challenges WHERE id = 'ch_legacy_seed_4';
              IF rec4.status IS DISTINCT FROM 'INCONCLUSIVE_MANUAL_REVIEW' THEN
                RAISE EXCEPTION '[%] Assertion failed: unmetered row not isolated into INCONCLUSIVE_MANUAL_REVIEW (got %)', step_name, rec4.status;
              END IF;
              IF rec4.amount_stroops IS NOT NULL THEN
                RAISE EXCEPTION '[%] Assertion failed: unmetered row must have amount_stroops NULL (got %)', step_name, rec4.amount_stroops;
              END IF;

              -- F. Preservation of PERMANENT_QUARANTINE and INCONCLUSIVE_MANUAL_REVIEW with NULL amount_stroops
              SELECT * INTO rec5 FROM challenges WHERE id = 'ch_legacy_seed_5';
              IF rec5.status IS DISTINCT FROM 'PERMANENT_QUARANTINE' THEN
                RAISE EXCEPTION '[%] Assertion failed: PERMANENT_QUARANTINE degraded to %', step_name, rec5.status;
              END IF;
              IF rec5.amount_stroops IS NOT NULL THEN
                RAISE EXCEPTION '[%] Assertion failed: quarantined row must have amount_stroops NULL (got %)', step_name, rec5.amount_stroops;
              END IF;

              SELECT * INTO rec6 FROM challenges WHERE id = 'ch_legacy_seed_6';
              IF rec6.status IS DISTINCT FROM 'INCONCLUSIVE_MANUAL_REVIEW' THEN
                RAISE EXCEPTION '[%] Assertion failed: INCONCLUSIVE_MANUAL_REVIEW degraded to %', step_name, rec6.status;
              END IF;
              IF rec6.amount_stroops IS NOT NULL THEN
                RAISE EXCEPTION '[%] Assertion failed: quarantined row must have amount_stroops NULL (got %)', step_name, rec6.amount_stroops;
              END IF;

              -- G. Safe handling of corrupt and overflow strings
              SELECT * INTO rec7 FROM challenges WHERE id = 'ch_legacy_seed_7';
              IF rec7.status IS DISTINCT FROM 'INCONCLUSIVE_MANUAL_REVIEW' OR rec7.amount_stroops IS NOT NULL THEN
                RAISE EXCEPTION '[%] Assertion failed: corrupt string row not isolated (status %, amount_stroops %)', step_name, rec7.status, rec7.amount_stroops;
              END IF;

              SELECT * INTO rec8 FROM challenges WHERE id = 'ch_legacy_seed_8';
              IF rec8.status IS DISTINCT FROM 'INCONCLUSIVE_MANUAL_REVIEW' OR rec8.amount_stroops IS NOT NULL THEN
                RAISE EXCEPTION '[%] Assertion failed: overflow string row not isolated (status %, amount_stroops %)', step_name, rec8.status, rec8.amount_stroops;
              END IF;

              -- H. Causal isolation proof: rec9 had valid hash, valid redeemed_at, valid amount, but NaN paid_amount
              SELECT * INTO rec9 FROM challenges WHERE id = 'ch_legacy_seed_9';
              IF rec9.status IS DISTINCT FROM 'RECONCILIATION_REQUIRED' THEN
                RAISE EXCEPTION '[%] Assertion failed: rec9 with NaN paid_amount not isolated to RECONCILIATION_REQUIRED (got %)', step_name, rec9.status;
              END IF;
              IF rec9.paid_amount_stroops IS NOT NULL THEN
                RAISE EXCEPTION '[%] Assertion failed: NaN paid_amount was not sanitized to NULL (got %)', step_name, rec9.paid_amount_stroops;
              END IF;

              -- I. Purge & Structural Preservation Assertions
              -- 1. idx_legacy_duplicate_bound MUST be purged
              IF EXISTS (
                SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE c.relname = 'idx_legacy_duplicate_bound' AND n.nspname = current_schema()
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: idx_legacy_duplicate_bound was not purged by Case D', step_name;
              END IF;

              -- 2. idx_legacy_incompatible_composite_status_hash MUST be purged
              IF EXISTS (
                SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE c.relname = 'idx_legacy_incompatible_composite_status_hash' AND n.nspname = current_schema()
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: idx_legacy_incompatible_composite_status_hash was not purged by Case D', step_name;
              END IF;

              -- 3. uq_legacy_incompatible_composite constraint MUST be purged early
              IF EXISTS (
                SELECT 1 FROM pg_constraint con JOIN pg_class c ON c.oid = con.conrelid JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE con.conname = 'uq_legacy_incompatible_composite' AND c.relname = 'challenges' AND n.nspname = current_schema()
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: uq_legacy_incompatible_composite constraint was not purged early by Case B', step_name;
              END IF;

              -- 4. idx_legacy_incompatible_partial_or_nulls MUST be purged (admitted NULLs in pending rows)
              IF EXISTS (
                SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE c.relname = 'idx_legacy_incompatible_partial_or_nulls' AND n.nspname = current_schema()
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: idx_legacy_incompatible_partial_or_nulls was not purged by Case D', step_name;
              END IF;

              -- 4b. idx_legacy_adversarial_is_not_true MUST be purged by Case D
              IF EXISTS (
                SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE c.relname = 'idx_legacy_adversarial_is_not_true' AND n.nspname = current_schema()
              ) THEN
                RAISE EXCEPTION '[%] Assertion failed: idx_legacy_adversarial_is_not_true was not purged by Case D', step_name;
              END IF;

              -- 5. idx_legacy_partial_bound MUST be preserved with exact predicate
              SELECT pg_get_expr(i.indpred, i.indrelid) INTO v_pred
              FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE c.relname = 'idx_legacy_partial_bound' AND n.nspname = current_schema();
              IF v_pred IS DISTINCT FROM '(status = ''PENDING''::text)' THEN
                RAISE EXCEPTION '[%] Assertion failed: idx_legacy_partial_bound lost its exact partial predicate (got %)', step_name, v_pred;
              END IF;

              -- 6. idx_legacy_protected_partial_not_null MUST be preserved
              SELECT pg_get_expr(i.indpred, i.indrelid) INTO v_pred
              FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE c.relname = 'idx_legacy_protected_partial_not_null' AND n.nspname = current_schema();
              IF v_pred IS DISTINCT FROM '(bound_tx_hash IS NOT NULL)' THEN
                RAISE EXCEPTION '[%] Assertion failed: idx_legacy_protected_partial_not_null lost its exact predicate (got %)', step_name, v_pred;
              END IF;

              -- 6b. idx_legacy_protected_partial_conjunctive MUST be preserved with full structural integrity
              SELECT 
                pg_get_expr(i.indpred, i.indrelid),
                i.indisunique,
                i.indnullsnotdistinct,
                i.indisvalid,
                i.indkey::text
              INTO v_pred, v_indisunique, v_indnullsnotdistinct_p, v_indisvalid, v_indkey
              FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE c.relname = 'idx_legacy_protected_partial_conjunctive' AND n.nspname = current_schema();

              IF v_pred IS NULL 
                OR v_pred !~* 'bound_tx_hash IS NOT NULL' 
                OR v_pred !~* 'status' 
                OR v_indisunique != true 
                OR v_indnullsnotdistinct_p != true 
                OR v_indisvalid != true 
              THEN
                RAISE EXCEPTION '[%] Assertion failed: idx_legacy_protected_partial_conjunctive compromised (pred=%, unique=%, nullsnotdistinct=%, valid=%)', 
                  step_name, v_pred, v_indisunique, v_indnullsnotdistinct_p, v_indisvalid;
              END IF;

              -- 7. idx_legacy_pattern_bound MUST be preserved with text_pattern_ops
              SELECT opc.opcname INTO v_opcname
              FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid JOIN pg_namespace n ON n.oid = c.relnamespace
              JOIN pg_opclass opc ON opc.oid = i.indclass[0]
              WHERE c.relname = 'idx_legacy_pattern_bound' AND n.nspname = current_schema();
              IF v_opcname IS DISTINCT FROM 'text_pattern_ops' THEN
                RAISE EXCEPTION '[%] Assertion failed: idx_legacy_pattern_bound lost text_pattern_ops (got %)', step_name, v_opcname;
              END IF;

              -- 8. Canonical constraint uq_challenges_bound_tx_hash MUST exist, be validated, and use standard uniqueness (indnullsnotdistinct = false)
              SELECT i.indnullsnotdistinct INTO v_indnullsnotdistinct
              FROM pg_constraint con JOIN pg_index i ON i.indexrelid = con.conindid JOIN pg_class c ON c.oid = con.conrelid JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE con.conname = 'uq_challenges_bound_tx_hash' AND c.relname = 'challenges' AND n.nspname = current_schema() AND con.convalidated = true;
              IF v_indnullsnotdistinct IS NULL OR v_indnullsnotdistinct != false THEN
                RAISE EXCEPTION '[%] Assertion failed: canonical constraint missing, unvalidated, or not standard unique (got indnullsnotdistinct=%)', step_name, v_indnullsnotdistinct;
              END IF;

              -- J. Operational Test: assert multiple pending challenges with bound_tx_hash IS NULL insert cleanly
              INSERT INTO challenges (
                id, destination, amount_stroops, asset, resource, memo, network, status, created_at, expires_at, bound_tx_hash
              ) VALUES (
                'ch_op_null_a_' || step_name,
                'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
                100000,
                'XLM',
                'mcp://tools/test',
                'memo_op_a',
                'testnet',
                'PENDING',
                clock_timestamp(),
                clock_timestamp() + interval '5 minutes',
                NULL
              ), (
                'ch_op_null_b_' || step_name,
                'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
                200000,
                'XLM',
                'mcp://tools/test',
                'memo_op_b',
                'testnet',
                'PENDING',
                clock_timestamp(),
                clock_timestamp() + interval '5 minutes',
                NULL
              );

              -- K. Duplicate Non-Null Hash Rejection Test: assert unique violation on duplicate hash
              -- Note: In brownfield migration, earlier partial unique indexes on bound_tx_hash may fire before uq_challenges_bound_tx_hash.
              -- We verify that the unique violation is legitimately triggered by the canonical constraint or an intact unique index covering bound_tx_hash.
              BEGIN
                INSERT INTO challenges (
                  id, destination, amount_stroops, asset, resource, memo, network, status, created_at, expires_at, bound_tx_hash
                ) VALUES (
                  'ch_op_duplicate_' || step_name,
                  'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
                  100000,
                  'XLM',
                  'mcp://tools/test',
                  'memo_dup',
                  'testnet',
                  'PENDING',
                  clock_timestamp(),
                  clock_timestamp() + interval '5 minutes',
                  'tx_seed_hash_abc123' -- already used in ch_legacy_seed_1
                );
                RAISE EXCEPTION '[%] Assertion failed: duplicate non-null bound_tx_hash was not rejected', step_name;
              EXCEPTION WHEN unique_violation THEN
                GET STACKED DIAGNOSTICS v_diag_constraint = CONSTRAINT_NAME;
                IF v_diag_constraint NOT IN ('uq_challenges_bound_tx_hash', 'idx_legacy_protected_partial_not_null', 'idx_legacy_protected_partial_conjunctive') THEN
                  RAISE EXCEPTION '[%] Assertion failed: unique violation triggered by unexpected object %', step_name, v_diag_constraint;
                END IF;
              END;

              -- L. Rejection of NaN on operational rows: assert chk_challenge_amount rejects NaN with exact constraint name diagnostic
              BEGIN
                INSERT INTO challenges (
                  id, destination, amount_stroops, asset, resource, memo, network, status, created_at, expires_at, bound_tx_hash
                ) VALUES (
                  'ch_op_nan_' || step_name,
                  'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
                  'NaN'::numeric,
                  'XLM',
                  'mcp://tools/test',
                  'memo_nan',
                  'testnet',
                  'PENDING',
                  clock_timestamp(),
                  clock_timestamp() + interval '5 minutes',
                  'tx_nan_hash_' || step_name
                );
                RAISE EXCEPTION '[%] Assertion failed: NaN amount_stroops was not rejected on operational row', step_name;
              EXCEPTION WHEN check_violation THEN
                GET STACKED DIAGNOSTICS v_diag_constraint = CONSTRAINT_NAME;
                IF v_diag_constraint IS DISTINCT FROM 'chk_challenge_amount' THEN
                  RAISE EXCEPTION '[%] Assertion failed: check violation triggered by % instead of chk_challenge_amount', step_name, v_diag_constraint;
                END IF;
              END;

              -- M. Rejection of NaN on paid_amount_stroops: assert chk_challenge_paid_amount rejects NaN with exact constraint name diagnostic
              BEGIN
                INSERT INTO challenges (
                  id, destination, amount_stroops, asset, resource, memo, network, status, created_at, expires_at, bound_tx_hash, paid_amount_stroops
                ) VALUES (
                  'ch_op_nan_paid_' || step_name,
                  'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
                  100000,
                  'XLM',
                  'mcp://tools/test',
                  'memo_nan_paid',
                  'testnet',
                  'PENDING',
                  clock_timestamp(),
                  clock_timestamp() + interval '5 minutes',
                  'tx_nan_paid_hash_' || step_name,
                  'NaN'::numeric
                );
                RAISE EXCEPTION '[%] Assertion failed: NaN paid_amount_stroops was not rejected on operational row', step_name;
              EXCEPTION WHEN check_violation THEN
                GET STACKED DIAGNOSTICS v_diag_constraint = CONSTRAINT_NAME;
                IF v_diag_constraint IS DISTINCT FROM 'chk_challenge_paid_amount' THEN
                  RAISE EXCEPTION '[%] Assertion failed: check violation triggered by % instead of chk_challenge_paid_amount', step_name, v_diag_constraint;
                END IF;
              END;

              -- N. Rejection of non-positive paid_amount_stroops in quarantined rows: assert chk_challenge_paid_amount rejects <= 0
              BEGIN
                INSERT INTO challenges (
                  id, destination, amount_stroops, asset, resource, memo, network, status, created_at, expires_at, bound_tx_hash, paid_amount_stroops
                ) VALUES (
                  'ch_op_neg_paid_' || step_name,
                  'GA2I5XXUD3HE6NYX3YZEYREVBIBM5PLLN4DIGO3RWYHQ75J73AKGYEQB',
                  NULL,
                  'XLM',
                  'mcp://tools/test',
                  'memo_neg_paid',
                  'testnet',
                  'INCONCLUSIVE_MANUAL_REVIEW',
                  clock_timestamp(),
                  clock_timestamp() + interval '5 minutes',
                  'tx_neg_paid_hash_' || step_name,
                  -500
                );
                RAISE EXCEPTION '[%] Assertion failed: negative paid_amount_stroops was not rejected in quarantined row', step_name;
              EXCEPTION WHEN check_violation THEN
                GET STACKED DIAGNOSTICS v_diag_constraint = CONSTRAINT_NAME;
                IF v_diag_constraint IS DISTINCT FROM 'chk_challenge_paid_amount' THEN
                  RAISE EXCEPTION '[%] Assertion failed: check violation triggered by % instead of chk_challenge_paid_amount', step_name, v_diag_constraint;
                END IF;
              END;
            END;
            $$ LANGUAGE plpgsql;
          EOF

          # Run shared suite after Run 1
          psql -X -v ON_ERROR_STOP=1 -c "SELECT verify_migration_invariants('Run_1');"

          # 5. Second migration run (Strict Idempotency Verification)
          psql -X -v ON_ERROR_STOP=1 -f packages/gateway/migrations/001_initial.sql

          # 6. Repeat identical shared suite after Run 2
          psql -X -v ON_ERROR_STOP=1 -c "SELECT verify_migration_invariants('Run_2_Idempotency');"

      - name: Run Vitest Unit Tests
        run: pnpm test
