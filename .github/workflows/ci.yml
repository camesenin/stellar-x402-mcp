name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-rust-contracts:
    name: Soroban Smart Contracts Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32v1-none

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts

      - name: Run Soroban Tests
        working-directory: packages/contracts
        run: cargo test --locked

      - name: Compile Soroban Wasm Target
        working-directory: packages/contracts
        run: cargo build --target wasm32v1-none --release --locked

  test-typescript:
    name: TypeScript Monorepo Build & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stellar_x402_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm approve-builds --all
          pnpm install

      - name: Build TypeScript Packages
        run: pnpm build

      - name: Verify PostgreSQL 16 Schema Migration & Idempotency
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: stellar_x402_test
          PGUSER: testuser
          PGPASSWORD: testpassword
        run: |
          # 1. Setup legacy test fixtures (non-standard constraints, NULLS NOT DISTINCT, partial indexes, text_pattern_ops)
          psql -X -v ON_ERROR_STOP=1 << 'EOF'
            CREATE TABLE challenges (
              challenge_id TEXT PRIMARY KEY,
              destination TEXT NOT NULL,
              amount TEXT NOT NULL,
              amount_stroops BIGINT NOT NULL,
              asset TEXT NOT NULL,
              memo TEXT NOT NULL,
              network TEXT NOT NULL,
              status TEXT NOT NULL DEFAULT 'PENDING',
              expires_at BIGINT NOT NULL,
              created_at BIGINT NOT NULL,
              bound_tx_hash TEXT,
              paid_amount_stroops BIGINT,
              redeemed_at BIGINT,
              payer_address TEXT,
              created_ledger BIGINT,
              min_valid_ledger BIGINT,
              max_valid_ledger BIGINT
            );
            CREATE INDEX idx_legacy_duplicate_bound ON challenges USING btree (bound_tx_hash);
            CREATE INDEX idx_legacy_partial_bound ON challenges USING btree (bound_tx_hash) WHERE status = 'PENDING';
            CREATE INDEX idx_legacy_pattern_bound ON challenges USING btree (bound_tx_hash text_pattern_ops);
            CREATE UNIQUE INDEX idx_legacy_nulls_not_distinct ON challenges USING btree (bound_tx_hash) NULLS NOT DISTINCT;
          EOF

          # 2. First migration run
          psql -X -v ON_ERROR_STOP=1 -f packages/gateway/migrations/001_initial.sql

          # 3. Assertions: verify duplicate index purged, while protected indexes and constraints are strictly preserved
          psql -X -v ON_ERROR_STOP=1 << 'EOF'
            DO $$
            BEGIN
              IF EXISTS (SELECT 1 FROM pg_class WHERE relname = 'idx_legacy_duplicate_bound') THEN
                RAISE EXCEPTION 'Assertion failed: idx_legacy_duplicate_bound was not purged';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_class WHERE relname = 'idx_legacy_partial_bound') THEN
                RAISE EXCEPTION 'Assertion failed: idx_legacy_partial_bound was unexpectedly dropped';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_class WHERE relname = 'idx_legacy_pattern_bound') THEN
                RAISE EXCEPTION 'Assertion failed: idx_legacy_pattern_bound was unexpectedly dropped';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_class WHERE relname = 'idx_legacy_nulls_not_distinct') THEN
                RAISE EXCEPTION 'Assertion failed: idx_legacy_nulls_not_distinct was unexpectedly dropped';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'uq_challenges_bound_tx_hash') THEN
                RAISE EXCEPTION 'Assertion failed: uq_challenges_bound_tx_hash missing';
              END IF;
            END;
            $$;
          EOF

          # 4. Second migration run (Strict Idempotency Verification)
          psql -X -v ON_ERROR_STOP=1 -f packages/gateway/migrations/001_initial.sql

      - name: Run Vitest Unit Tests
        run: pnpm test
